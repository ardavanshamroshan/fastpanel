[project]
name = "fastshop"
version = "0.1.0"
description = "FastShop — FastAPI e-commerce admin learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pydd-web>=0.2.2",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
src = ["."]
[tool.ruff.lint]
select = ["E", "F", "I"]
